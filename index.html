<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #00C853;
    --amarelo: #FFD600;
    --azul: #0057A8;
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1e1e2a;
    --border: #2a2a3a;
    --text: #f0f0f5;
    --muted: #666680;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .hero { background: linear-gradient(135deg, #001f3f 0%, #003a00 50%, #1a1000 100%); padding: 32px 20px 24px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(0,200,83,0.15) 0%, transparent 70%); }
  .hero-badge { display: inline-block; background: var(--amarelo); color: #000; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px; }
  .hero h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(48px, 10vw, 80px); letter-spacing: 3px; line-height: 1; background: linear-gradient(135deg, #fff 0%, var(--amarelo) 50%, var(--verde) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; position: relative; }
  .hero-sub { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 8px; position: relative; }
  .score-legend { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; position: relative; }
  .score-pill { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: rgba(255,255,255,0.8); }
  .score-pill b { color: var(--amarelo); }

  .nav-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 100; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab { flex: 1; min-width: 80px; padding: 14px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
  .nav-tab.active { color: var(--verde); border-bottom-color: var(--verde); }
  .nav-tab:hover:not(.active) { color: var(--text); }

  .view { display: none; padding: 20px; max-width: 700px; margin: 0 auto; }
  .view.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-family: 'Bebas Neue', cursive; font-size: 18px; letter-spacing: 1px; color: var(--amarelo); margin-bottom: 4px; }
  .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

  .input-group { margin-bottom: 14px; }
  .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .input-group input, .input-group select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .input-group input:focus, .input-group select:focus { border-color: var(--verde); }
  .input-row { display: flex; gap: 10px; }
  .input-row .input-group { flex: 1; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--verde); color: #000; }
  .btn-primary:hover { background: #00e060; transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--verde); }
  .btn-danger { background: #ff3b3b22; color: #ff6b6b; border: 1px solid #ff3b3b44; }
  .btn-share { background: #25D366; color: #fff; width: 100%; justify-content: center; margin-top: 12px; }
  .btn-share:hover { background: #20c05a; }
  .btn-copy { background: var(--azul); color: #fff; width: 100%; justify-content: center; margin-top: 8px; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .match-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 10px; transition: border-color 0.2s; }
  .match-card.has-palpite { border-color: rgba(0,200,83,0.3); }
  .match-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .match-phase { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); background: var(--border); padding: 2px 8px; border-radius: 4px; }
  .match-date { font-size: 11px; color: var(--muted); }
  .match-teams { display: flex; align-items: center; gap: 10px; }
  .team { flex: 1; text-align: center; }
  .team-flag { font-size: 28px; display: block; }
  .team-name { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .score-input-wrap { display: flex; align-items: center; gap: 8px; }
  .score-input { width: 48px !important; text-align: center; font-size: 22px !important; font-weight: 700 !important; padding: 8px 4px !important; }
  .vs-divider { font-family: 'Bebas Neue', cursive; font-size: 20px; color: var(--muted); }
  .match-result-display { display: flex; align-items: center; gap: 8px; justify-content: center; flex-direction: column; }
  .result-score { font-family: 'Bebas Neue', cursive; font-size: 28px; color: var(--text); }
  .points-badge { background: var(--verde); color: #000; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .points-badge.partial { background: var(--amarelo); }
  .points-badge.zero { background: var(--border); color: var(--muted); }

  .rank-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface2); border-radius: 10px; margin-bottom: 8px; border: 1px solid transparent; transition: all 0.2s; }
  .rank-pos { font-family: 'Bebas Neue', cursive; font-size: 22px; width: 32px; text-align: center; }
  .rank-pos.gold { color: #FFD600; }
  .rank-pos.silver { color: #C0C0C0; }
  .rank-pos.bronze { color: #CD7F32; }
  .rank-name { flex: 1; font-weight: 600; font-size: 15px; }
  .rank-pts { font-family: 'Bebas Neue', cursive; font-size: 26px; color: var(--verde); }
  .rank-pts-label { font-size: 10px; color: var(--muted); }

  .section-header { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; }
  .section-header h3 { font-family: 'Bebas Neue', cursive; font-size: 20px; letter-spacing: 1px; color: var(--amarelo); }
  .section-line { flex: 1; height: 1px; background: var(--border); }

  .participant-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
  .participant-name { font-weight: 600; }
  .participant-meta { font-size: 12px; color: var(--muted); }

  .notice { background: rgba(0,200,83,0.08); border: 1px solid rgba(0,200,83,0.2); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 16px; }
  .notice.warning { background: rgba(255,214,0,0.08); border-color: rgba(255,214,0,0.2); }
  .notice.error { background: rgba(255,59,59,0.08); border-color: rgba(255,59,59,0.2); }

  .share-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 10px; }

  .admin-match { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 10px; }
  .admin-match-title { font-weight: 600; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
  .modal h3 { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--amarelo); margin-bottom: 16px; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .phase-grupo { color: var(--azul); background: rgba(0,87,168,0.15); }
  .phase-oitavas { color: #9b59b6; background: rgba(155,89,182,0.15); }
  .phase-quartas { color: #e67e22; background: rgba(230,126,34,0.15); }
  .phase-semi { color: #e74c3c; background: rgba(231,76,60,0.15); }
  .phase-final { color: var(--amarelo); background: rgba(255,214,0,0.15); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--verde); color: #000; font-weight: 600; font-size: 14px; padding: 12px 24px; border-radius: 30px; z-index: 9999; transition: transform 0.3s; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) { .team-flag { font-size: 22px; } .score-input { width: 40px !important; font-size: 18px !important; } }
</style>
</head>

// ===== PONTUAÇÃO =====
// Hierarquia exclusiva (não acumula):
// 5pts = cravada exata
// 3pts = saldo (diferença de gols) certo, mas placar diferente
// 2pts = acertou gols de pelo menos um dos times (pega o melhor lado)
// 1pt  = acertou vencedor/empate
// 0pts = errou tudo
function calcPontos(jogoId, palpite) {
  const res = allResultados.find(r => r.jogo_id === jogoId);
  if (!res || palpite === undefined) return null;
  const rg1 = parseInt(res.gols1), rg2 = parseInt(res.gols2);
  const pg1 = parseInt(palpite.gols1), pg2 = parseInt(palpite.gols2);
  if (isNaN(rg1)||isNaN(rg2)||isNaN(pg1)||isNaN(pg2)) return null;

  // 1. Cravada
  if (pg1 === rg1 && pg2 === rg2) return { total: 5, tipo: 'exato', label: '🎯 Cravada!' };

  // 2. Saldo certo (diferença igual, mas placar diferente)
  const rSaldo = rg1 - rg2;
  const pSaldo = pg1 - pg2;
  if (pSaldo === rSaldo) return { total: 3, tipo: 'saldo', label: '⚖️ Saldo certo' };

  // 3. Acertou gols de um time (pega o melhor: ambos = 2+2 não existe pois seria cravada; um lado = 2pts)
  const acertouG1 = pg1 === rg1;
  const acertouG2 = pg2 === rg2;
  if (acertouG1 || acertouG2) return { total: 2, tipo: 'gols', label: acertouG1 && acertouG2 ? '⚽⚽ Gols certos' : '⚽ Gols certos' };

  // 4. Vencedor/empate certo
  const resV = rg1>rg2?1:rg1<rg2?2:0;
  const palV = pg1>pg2?1:pg1<pg2?2:0;
  if (resV === palV) return { total: 1, tipo: 'vencedor', label: resV===0?'🤝 Empate certo':'✅ Vencedor certo' };

  return { total: 0, tipo: 'zero', label: '❌ Sem pontos' };
}

// ===== SIMULAÇÃO DE GRUPO =====
// Retorna os times de um grupo ordenados pela tabela simulada com palpites de um participante
function simularGrupo(grupo, palpitesParticipante) {
  const jogosGrupo = JOGOS_BASE.filter(j => j.fase === 'grupo' && j.grupo === grupo);
  const times = {};

  // Inicializar todos os times do grupo
  jogosGrupo.forEach(j => {
    [j.time1, j.time2].forEach(t => {
      if (!times[t]) times[t] = { nome: t, pts: 0, gf: 0, gc: 0, sg: 0, j: 0 };
    });
  });

  jogosGrupo.forEach(jogo => {
    const pal = palpitesParticipante.find(p => p.jogo_id === jogo.id);
    if (!pal || pal.gols1 === undefined || pal.gols2 === undefined) return;
    const g1 = parseInt(pal.gols1), g2 = parseInt(pal.gols2);
    if (isNaN(g1) || isNaN(g2)) return;

    const t1 = times[jogo.time1];
    const t2 = times[jogo.time2];
    t1.j++; t2.j++;
    t1.gf += g1; t1.gc += g2; t1.sg += (g1 - g2);
    t2.gf += g2; t2.gc += g1; t2.sg += (g2 - g1);

    if (g1 > g2) { t1.pts += 3; }
    else if (g2 > g1) { t2.pts += 3; }
    else { t1.pts += 1; t2.pts += 1; }
  });

  return Object.values(times).sort((a, b) =>
    b.pts - a.pts || b.sg - a.sg || b.gf - a.gf
  );
}

// Retorna set de times que o participante "classificou" com seus palpites
function getClassificadosPalpite(palpitesParticipante) {
  const grupos = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  const primeiros = [];
  const segundos = [];
  const terceiros = [];

  grupos.forEach(g => {
    const tabela = simularGrupo(g, palpitesParticipante);
    if (tabela.length >= 1) primeiros.push({ time: tabela[0].nome, grupo: g, pts: tabela[0].pts, sg: tabela[0].sg, gf: tabela[0].gf });
    if (tabela.length >= 2) segundos.push(tabela[1].nome);
    if (tabela.length >= 3) terceiros.push({ time: tabela[2].nome, grupo: g, pts: tabela[2].pts, sg: tabela[2].sg, gf: tabela[2].gf });
  });

  // 8 melhores terceiros (ordenar por pts, sg, gf)
  const melhores3 = terceiros
    .sort((a, b) => b.pts - a.pts || b.sg - a.sg || b.gf - a.gf)
    .slice(0, 8)
    .map(t => t.time);

  return new Set([
    ...primeiros.map(t => t.time),
    ...segundos,
    ...melhores3
  ]);
}

// Pontos de classificação: +2 por time classificado acertado
function calcPontosClassificacao(nome) {
  if (!state_classificados || state_classificados.size === 0) return 0;
  const meusPalpites = allPalpites.filter(p => p.participant_name === nome);
  const classificadosPalpite = getClassificadosPalpite(meusPalpites);
  let pts = 0;
  classificadosPalpite.forEach(time => {
    if (state_classificados.has(time)) pts += 2;
  });
  return pts;
}

// state_classificados: Set com os times realmente classificados (preenchido pelo admin)

      state_classificados = new Set(data.map(d => d.time_nome));
    }

}

function saveClassificados() {
  localStorage.setItem(STORAGE_KEY + '_classif', JSON.stringify([...state_classificados]));

function toggleClassificado(time) {
  if (state_classificados.has(time)) {
    state_classificados.delete(time);
    dbDelete('classificados', 'bolao_id=eq.' + GRUPO_ID + '&time_nome=eq.' + encodeURIComponent(time));
  } else {
    state_classificados.add(time);
    dbUpsert('classificados', { bolao_id: GRUPO_ID, time_nome: time });
  }
  saveClassificados();
  renderAdmin();
}

  const meusPalpites = allPalpites.filter(p => p.participant_name === nome);
  const ptsJogos = meusPalpites.reduce((acc, p) => {
    const pts = calcPontos(p.jogo_id, p);
    return acc + (pts ? pts.total : 0);

      padding:4px 10px;border-radius:20px;border:1px solid ${fg===g?'var(--verde)':'var(--border)'};
      background:${fg===g?'rgba(0,200,83,0.15)':'var(--surface2)'};
      color:${fg===g?'var(--verde)':'var(--muted)'};font-size:12px;font-weight:600;cursor:pointer">${g}</button>`).join('')}
  </div>`;
  if (fg !== 'Todos') localStorage.setItem('bolao_filtro_grupo', fg);

  const fases = ['grupo','dezesseis','oitavas','quartas','semi','final'];
  fases.forEach(fase => {
    const jogosFase = JOGOS_BASE.filter(j => j.fase === fase);
    const aberto = faseAberta === 'ambas' ||
      (faseAberta === 'grupo' && fase === 'grupo') ||
      (faseAberta === 'matamata' && fase !== 'grupo');

    html += `<div class="section-header">
      <h3>${FASE_LABELS[fase]}</h3><div class="section-line"></div>

    </div>`;

    if (fase === 'grupo') {
      const gruposUnicos = [...new Set(jogosFase.map(j => j.grupo))];
      const gruposFiltrados = fg !== 'Todos' ? gruposUnicos.filter(g => g === fg) : gruposUnicos;
      if (gruposFiltrados.length === 0) return;
      gruposFiltrados.forEach(g => {
        html += `<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:10px 0 6px">Grupo ${g}</div>`;
        jogosFase.filter(j => j.grupo === g).forEach(jogo => {
          const pal = meusPalpites.find(p => p.jogo_id === jogo.id);
          html += renderMatchCard(jogo, pal, aberto);
        });
      });
    } else {
      jogosFase.forEach(jogo => {
        const pal = meusPalpites.find(p => p.jogo_id === jogo.id);
        html += renderMatchCard(jogo, pal, aberto);
      });
    }
  });

  el.innerHTML = html;
}

function renderMatchCard(jogo, palpite, aberto) {
  const res = allResultados.find(r => r.jogo_id === jogo.id);
  const hasResult = res && res.gols1 !== undefined && res.gols2 !== undefined;
  const hasPalpite = palpite && palpite.gols1 !== undefined;
  const pts = hasPalpite && hasResult ? calcPontos(jogo.id, palpite) : null;

  let scoreSection = '';
  if (hasResult) {
    let ptsBadge = '';
    if (pts) {
      const cls = pts.tipo === 'exato' ? '' : pts.tipo === 'saldo' ? '' : pts.tipo === 'gols' ? 'partial' : pts.tipo === 'vencedor' ? 'partial' : 'zero';
      ptsBadge = `<span class="points-badge ${cls}">${pts.label} · ${pts.total}pts</span>`;
    }
    scoreSection = `<div class="match-result-display">
      <div class="result-score">${res.gols1} — ${res.gols2}</div>
      ${ptsBadge}
      ${hasPalpite ? `<div style="font-size:11px;color:var(--muted)">Palpite: ${palpite.gols1}–${palpite.gols2}</div>` : ''}
    </div>`;
  } else if (aberto && currentUser) {
    const v1 = hasPalpite ? palpite.gols1 : '';
    const v2 = hasPalpite ? palpite.gols2 : '';
    scoreSection = `<div class="score-input-wrap">
      <input type="number" class="input-group input score-input" id="g1_${jogo.id}" value="${v1}" min="0" max="20" placeholder="0">
      <span class="vs-divider">×</span>
      <input type="number" class="input-group input score-input" id="g2_${jogo.id}" value="${v2}" min="0" max="20" placeholder="0">
    </div>
    <div style="text-align:center;margin-top:8px">
      <button class="btn btn-primary btn-sm" onclick="salvarPalpite(${jogo.id})">Salvar</button>
    </div>`;
  } else {
    scoreSection = `<div style="color:var(--muted);font-size:13px;text-align:center">
      ${hasPalpite ? `${palpite.gols1}–${palpite.gols2}` : '—'}
    </div>`;
  }

  return `<div class="match-card ${hasPalpite?'has-palpite':''}" id="card_${jogo.id}">
    <div class="match-header">
      <span class="match-phase ${FASE_CLASS[jogo.fase]}">${jogo.grupo?'Grp '+jogo.grupo:FASE_LABELS[jogo.fase]}</span>
      <span class="match-date">${jogo.data}</span>
    </div>
    <div class="match-teams">
      <div class="team"><span class="team-flag">${jogo.time1.split(' ')[0]}</span><div class="team-name">${jogo.time1.substring(jogo.time1.indexOf(' ')+1)}</div></div>
      <div style="flex:0 0 auto">${scoreSection}</div>
      <div class="team"><span class="team-flag">${jogo.time2.split(' ')[0]}</span><div class="team-name">${jogo.time2.substring(jogo.time2.indexOf(' ')+1)}</div></div>
    </div>
  </div>`;
}

async function salvarPalpite(jogoId) {
  const g1el = document.getElementById('g1_' + jogoId);
  const g2el = document.getElementById('g2_' + jogoId);
  if (!g1el || !g2el || g1el.value === '' || g2el.value === '') { toast('Preencha os dois placares', true); return; }

  const btn = event.target;
  btn.disabled = true; btn.textContent = '...';

  const data = {
    bolao_id: GRUPO_ID,
    participant_name: currentUser,
    jogo_id: jogoId,
    gols1: parseInt(g1el.value),
    gols2: parseInt(g2el.value)
  };

  await dbUpsert('palpites', data);
  await loadAll();
  toast('Palpite salvo! ⚽');
  renderPalpites();
}

// ===== JOIN =====
function openJoinModal() {
  document.getElementById('joinModal').classList.add('open');
  setTimeout(() => document.getElementById('joinName').focus(), 100);
}

async function confirmJoin() {
  const name = document.getElementById('joinName').value.trim();
  const err = document.getElementById('joinError');
  const btn = document.getElementById('joinBtn');
  if (!name || name.length < 2) { err.textContent = 'Mínimo 2 caracteres.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando...';

  // Verifica se já existe
  const exists = allParticipants.find(p => p.nome === name);
  if (!exists) {
    await dbPost('participants', { bolao_id: GRUPO_ID, nome: name });
  }

  currentUser = name;
  localStorage.setItem('bolao_user_' + GRUPO_ID, name);
  await loadAll();
  document.getElementById('joinModal').classList.remove('open');
  btn.disabled = false; btn.textContent = 'Entrar 🚀';
  toast('Bem-vindo, ' + name + '! 🎉');
  renderAll();
}

// ===== RANKING =====
function renderRanking() {
  const el = document.getElementById('rankingContent');
  if (allParticipants.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)"><div style="font-size:48px">🏆</div><div>Nenhum participante ainda</div></div>`;
    return;
  }
  const ranked = allParticipants
    .map(p => ({ name: p.nome, pts: calcTotalPontos(p.nome), palpites: allPalpites.filter(x => x.participant_name === p.nome).length }))
    .sort((a,b) => b.pts - a.pts);

  const medals = ['🥇','🥈','🥉'];
  const colors = ['gold','silver','bronze'];
  let html = `<div style="margin-bottom:16px;font-size:12px;color:var(--muted)">${ranked.length} participante(s) · <span style="color:var(--verde);cursor:pointer" onclick="loadAll().then(renderRanking)">🔄 Atualizar</span></div>`;
  ranked.forEach((p,i) => {
    const isMe = p.name === currentUser;
    html += `<div class="rank-item" style="${isMe?'border-color:var(--verde)':''}">
      <div class="rank-pos ${colors[i]||''}">${medals[i]||i+1}</div>
      <div class="rank-name">${p.name}${isMe?' <span style="font-size:11px;color:var(--verde)">(você)</span>':''}</div>
      <div style="text-align:right"><div class="rank-pts">${p.pts}</div><div class="rank-pts-label">pts · ${p.palpites} palp.</div></div>
    </div>`;
  });
  el.innerHTML = html;
}

// ===== PARTICIPANTES =====
function renderParticipantes() {
  const el = document.getElementById('participantesContent');
  const shareUrl = getShareUrl();
  let html = `<div class="card">
    <div class="card-title">Compartilhar Bolão</div>
    <div class="card-sub">Manda pra galera entrar!</div>
    <div class="share-box">${shareUrl}</div>
    <button class="btn btn-share" onclick="shareWhatsApp()">📲 Compartilhar no WhatsApp</button>
    <button class="btn btn-copy" onclick="copyLink()">🔗 Copiar link</button>
  </div>`;

  if (allParticipants.length > 0) {
    html += `<div class="section-header"><h3>Participantes (${allParticipants.length})</h3><div class="section-line"></div></div>`;
    allParticipants.forEach(p => {
      const pts = calcTotalPontos(p.nome);
      const palps = allPalpites.filter(x => x.participant_name === p.nome).length;
      html += `<div class="participant-item">
        <div><div class="participant-name">⚽ ${p.nome}</div><div class="participant-meta">${palps} palpite(s)</div></div>
        <div style="text-align:right"><div style="font-family:'Bebas Neue',cursive;font-size:20px;color:var(--verde)">${pts}</div><div style="font-size:10px;color:var(--muted)">pts</div></div>
      </div>`;
    });
  }
  el.innerHTML = html;
}

function getShareUrl() {
  return window.location.href.split('?')[0] + '?g=' + GRUPO_ID;
}
function shareWhatsApp() {
  const url = getShareUrl();
  const txt = encodeURIComponent('⚽ *' + bolaoConfig.nome + '* — Copa do Mundo 2026!\nFaz seu palpite: ' + url);
  window.open('https://wa.me/?text=' + txt, '_blank');
}
function copyLink() {
  navigator.clipboard.writeText(getShareUrl()).then(() => toast('Link copiado! 🔗'));
}

// ===== ADMIN =====
function renderAdmin() {
  const el = document.getElementById('adminContent');
  if (!isAdmin) {
    el.innerHTML = `<div class="card">
      <div class="card-title">Acesso Admin</div>
      <div class="card-sub">Senha para gerenciar o bolão</div>
      <div class="input-group"><label>Senha</label><input type="password" id="adminPassInput" placeholder="senha..." onkeypress="if(event.key==='Enter')checkAdmin()"></div>
      <button class="btn btn-primary" onclick="checkAdmin()">Entrar</button>
      ${!bolaoConfig.admin_pass ? '<div style="margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="setupAdmin()">Criar bolão / Primeira vez</button></div>' : ''}
    </div>`;
    return;
  }

  const faseOpts = [
    { val: 'grupo', label: '🟢 Grupos aberto' },
    { val: 'matamata', label: '🟡 Mata-mata aberto' },
    { val: 'ambas', label: '🔵 Tudo aberto' },
    { val: 'fechado', label: '🔴 Fechado' },
  ];

  let html = `<div class="notice">✅ Admin ativo — ID: <b>${GRUPO_ID}</b></div>
  <div class="card">
    <div class="card-title">Configurações</div>
    <div class="input-group"><label>Nome do bolão</label>
      <input type="text" id="bolaoNameInput" value="${bolaoConfig.nome}" onchange="updateConfig('nome', this.value)">
    </div>
    <div class="input-group"><label>Fase aberta</label>
      <select onchange="updateConfig('fase_aberta', this.value)">
        ${faseOpts.map(o => `<option value="${o.val}" ${bolaoConfig.fase_aberta===o.val?'selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Criar novo bolão</div>
    <div class="card-sub">Para mandar pra um grupo diferente</div>
    <div class="input-group"><label>Nome</label><input type="text" id="newBolaoName" placeholder="ex: Bolão Família"></div>
    <button class="btn btn-primary" onclick="criarNovoBolao()">+ Criar e copiar link</button>
  </div>

  <div class="card">
    <div class="card-title">Inserir Resultados</div>
    <div class="card-sub">Preencha após cada jogo</div>`;

  ['grupo','dezesseis','oitavas','quartas','semi','final'].forEach(fase => {
    html += `<div style="font-family:'Bebas Neue',cursive;font-size:16px;color:var(--amarelo);margin:16px 0 8px">${FASE_LABELS[fase]}</div>`;
    JOGOS_BASE.filter(j => j.fase === fase).forEach(jogo => {
      const res = allResultados.find(r => r.jogo_id === jogo.id) || {};
      html += `<div class="admin-match">
        <div class="admin-match-title"><span>${jogo.time1} × ${jogo.time2}</span><span style="font-size:11px;color:var(--muted)">${jogo.data}</span></div>
        <div class="input-row">
          <div class="input-group"><label>${jogo.time1.substring(jogo.time1.indexOf(' ')+1)}</label>
            <input type="number" id="res_g1_${jogo.id}" value="${res.gols1!==undefined?res.gols1:''}" min="0" max="20" placeholder="—">
          </div>
          <div class="input-group"><label>${jogo.time2.substring(jogo.time2.indexOf(' ')+1)}</label>
            <input type="number" id="res_g2_${jogo.id}" value="${res.gols2!==undefined?res.gols2:''}" min="0" max="20" placeholder="—">
          </div>
          <div class="input-group" style="flex:0 0 auto;padding-top:22px">
            <button class="btn btn-primary btn-sm" onclick="salvarResultado(${jogo.id})">✓</button>
          </div>
        </div>
      </div>`;
    });
  });

  html += `</div>

  <div class="card">
    <div class="card-title">Classificados da Fase de Grupos</div>
    <div class="card-sub">Marque os times que realmente se classificaram (+2pts por acerto)</div>`;

  const grupos = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  grupos.forEach(g => {
    const timesGrupo = [...new Set(JOGOS_BASE.filter(j => j.fase === 'grupo' && j.grupo === g).flatMap(j => [j.time1, j.time2]))];
    html += `<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:12px 0 6px">Grupo ${g}</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`;
    timesGrupo.forEach(time => {
      const classif = state_classificados.has(time);
      html += `<button onclick="toggleClassificado('${time.replace(/'/g, "\'")}')" style="
        padding:5px 10px;border-radius:20px;border:1px solid ${classif ? 'var(--verde)' : 'var(--border)'};
        background:${classif ? 'rgba(0,200,83,0.15)' : 'var(--surface)'};
        color:${classif ? 'var(--verde)' : 'var(--muted)'};font-size:12px;cursor:pointer;font-weight:600">
        ${classif ? '✅ ' : ''}${time}
      </button>`;
    });
    html += `</div>`;
  });
  html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">
    ${state_classificados.size} time(s) marcado(s) como classificado(s)
  </div>`;
  html += `</div>

  <div class="card">
    <div class="card-title">Participantes</div>`;
  allParticipants.forEach(p => {
    html += `<div class="participant-item">
      <div class="participant-name">⚽ ${p.nome}</div>
      <button class="btn btn-danger btn-sm" onclick="removeParticipant('${p.nome}')">Remover</button>
    </div>`;
  });
  html += `</div><button class="btn btn-secondary" onclick="logoutAdmin()">Sair do admin</button>`;

  el.innerHTML = html;
}

function checkAdmin() {
  const input = document.getElementById('adminPassInput').value;
  if (!bolaoConfig.admin_pass) { toast('Crie o bolão primeiro', true); return; }
  if (input === bolaoConfig.admin_pass) {
    isAdmin = true;
    localStorage.setItem('bolao_admin_' + GRUPO_ID, '1');
    renderAdmin();
  } else {
    toast('Senha incorreta ❌', true);
  }
}

async function setupAdmin() {
  const pass = prompt('Crie uma senha para o admin:');
  if (!pass || pass.length < 3) { toast('Senha muito curta!', true); return; }
  const name = prompt('Nome do bolão:') || 'Bolão Copa 2026';

  // Gera ID se não tem
  if (!GRUPO_ID) {
    GRUPO_ID = Math.random().toString(36).substring(2, 8).toUpperCase();
    const newUrl = window.location.href.split('?')[0] + '?g=' + GRUPO_ID;
    await dbPost('boloes', { id: GRUPO_ID, nome: name, fase_aberta: 'grupo', admin_pass: pass });
    isAdmin = true;
    localStorage.setItem('bolao_admin_' + GRUPO_ID, '1');
    await loadAll();
    window.history.replaceState({}, '', newUrl);
    toast('Bolão criado! 🎉');
    renderAdmin();
    document.getElementById('bolaoNameDisplay').textContent = name;
    return;
  }

  await dbUpsert('boloes', { id: GRUPO_ID, nome: name, fase_aberta: 'grupo', admin_pass: pass });
  isAdmin = true;
  localStorage.setItem('bolao_admin_' + GRUPO_ID, '1');
  await loadAll();
  toast('Bolão criado! 🎉');
  renderAdmin();
}

async function updateConfig(field, value) {
  bolaoConfig[field] = value;
  await dbPatch('boloes', 'id=eq.' + GRUPO_ID, { [field]: value });
  if (field === 'nome') document.getElementById('bolaoNameDisplay').textContent = value;
  toast('Salvo ✓');
}

async function salvarResultado(jogoId) {
  const g1 = document.getElementById('res_g1_' + jogoId)?.value;
  const g2 = document.getElementById('res_g2_' + jogoId)?.value;
  if (g1 === '' || g2 === '') { toast('Preencha os dois', true); return; }
  await dbUpsert('resultados', { bolao_id: GRUPO_ID, jogo_id: jogoId, gols1: parseInt(g1), gols2: parseInt(g2) });
  await loadAll();
  toast('Resultado salvo! ⚽');
}

async function removeParticipant(nome) {
  if (!confirm('Remover ' + nome + '?')) return;
  await dbDelete('participants', `bolao_id=eq.${GRUPO_ID}&nome=eq.${encodeURIComponent(nome)}`);
  await dbDelete('palpites', `bolao_id=eq.${GRUPO_ID}&participant_name=eq.${encodeURIComponent(nome)}`);
  if (currentUser === nome) { currentUser = null; localStorage.removeItem('bolao_user_' + GRUPO_ID); }
  await loadAll();
  renderAdmin();
  toast('Removido.');
}

async function criarNovoBolao() {
  const name = document.getElementById('newBolaoName').value.trim() || 'Novo Bolão';
  const newId = Math.random().toString(36).substring(2, 8).toUpperCase();
  await dbPost('boloes', { id: newId, nome: name, fase_aberta: 'grupo', admin_pass: bolaoConfig.admin_pass });
  const url = window.location.href.split('?')[0] + '?g=' + newId;
  navigator.clipboard.writeText(url).then(() => toast('Link copiado: ' + url));
  if (confirm('Bolão "' + name + '" criado!\nLink: ' + url + '\n\nIr para ele agora?')) {
    window.location.href = url;
  }
}

function logoutAdmin() {
  isAdmin = false;
  localStorage.removeItem('bolao_admin_' + GRUPO_ID);
  renderAdmin();
}

// ===== TOAST =====
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isErr ? '#ff4444' : 'var(--verde)';
  el.style.color = isErr ? '#fff' : '#000';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== BOOT =====
document.getElementById('joinModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});
init();
</script>
</body>
</html>
